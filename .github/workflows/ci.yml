name: tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run host test suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
